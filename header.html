<script>

const menuBtn = document.getElementById("menuBtn");
const mobileMenu = document.getElementById("mobileMenu");

const mobileCategoryBtn =
    document.getElementById("mobileCategoryBtn");

const mobileCategories =
    document.getElementById("mobileCategories");


/* Open / Close Mobile Menu */

menuBtn.addEventListener("click", function () {

    mobileMenu.classList.toggle("show");

    const icon = menuBtn.querySelector("i");

    if (mobileMenu.classList.contains("show")) {

        icon.classList.remove("fa-bars");
        icon.classList.add("fa-xmark");

    } else {

        icon.classList.remove("fa-xmark");
        icon.classList.add("fa-bars");

    }

});


/* Mobile Categories */

mobileCategoryBtn.addEventListener("click", function () {

    mobileCategories.classList.toggle("show");

});


/* Close menu when clicking a normal link */

const mobileLinks =
    mobileMenu.querySelectorAll("a");

mobileLinks.forEach(function (link) {

    link.addEventListener("click", function () {

        mobileMenu.classList.remove("show");

        const icon = menuBtn.querySelector("i");

        icon.classList.remove("fa-xmark");
        icon.classList.add("fa-bars");

    });

});

</script>
