    // Display search results.
    
        
        // ========== DISPLAY RESULTS ==========
    function displayResults(matches) {
        searchResults.innerHTML = "";

        if (matches.length === 0) {
            const message = document.createElement("div");
            message.className = "search-no-result";
            message.textContent = "No matching tools found.";
            searchResults.appendChild(message);
        } else {
            matches.forEach(function (tool) {
                const link = document.createElement("a");
                link.className = "search-result";
                link.href = tool.url;

                const title = document.createElement("strong");
                title.textContent = tool.name;

                const description = document.createElement("small");
                description.textContent = tool.description;

                link.appendChild(title);
                link.appendChild(description);
                searchResults.appendChild(link);
            });
        }

        // Show the dropdown
        searchResults.classList.add("show");
        searchResults.style.display = "block";
    }


    function searchTools() {
        const query = searchInput.value.trim().toLowerCase();

        // Hide results if input is empty
        if (query.length === 0) {
            searchResults.innerHTML = "";
            searchResults.classList.remove("show");
            searchResults.style.display = "none";
            return;
        }

        const searchWords = query.split(/\s+/);

        // Score every tool
        const scored = tools.map(function (tool) {
            const name = tool.name.toLowerCase();
            const description = tool.description.toLowerCase();
            const keywords = tool.keywords.toLowerCase();
            const searchableText = name + " " + description + " " + keywords;

            // Must contain every typed word
            const matchesAll = searchWords.every(function (word) {
                return searchableText.includes(word);
            });

            if (!matchesAll) return null;

            let score = 0;

            // Highest priority: name starts with the full query
            if (name.startsWith(query)) {
                score += 100;
            } else if (name.includes(query)) {
                score += 60;
            }

            // Extra points for each word
            searchWords.forEach(function (word) {
                if (name.includes(word)) score += 20;
                if (name.startsWith(word)) score += 15;
                if (keywords.includes(word)) score += 8;
                if (description.includes(word)) score += 4;
            });

            // Slight preference for shorter names
            score += Math.max(0, 30 - name.length);

            return { tool: tool, score: score };
        }).filter(Boolean);

        // Sort highest score first
        scored.sort(function (a, b) {
            return b.score - a.score;
        });

        const matches = scored.map(function (item) {
            return item.tool;
        });

        displayResults(matches);
    }


    // ========== EVENT LISTENERS ==========

    // Show results while typing
    searchInput.addEventListener("input", searchTools);

    // Search button click
    searchButton.addEventListener("click", function () {
        searchInput.focus();
        searchTools();
    });

    // Enter → open first result | Escape → close
    searchInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            event.preventDefault();
            const firstResult = searchResults.querySelector("a");
            if (firstResult) {
                window.location.href = firstResult.href;
            }
        }

        if (event.key === "Escape") {
            searchResults.classList.remove("show");
            searchResults.style.display = "none";
        }
    });

    // Close when clicking outside
    document.addEventListener("click", function (event) {
        if (searchContainer && !searchContainer.contains(event.target)) {
            searchResults.classList.remove("show");
            searchResults.style.display = "none";
        }
    });

    // Re-show results when focusing back on the input
    searchInput.addEventListener("focus", function () {
        if (searchInput.value.trim() !== "") {
            searchTools();
        }
    });
}
